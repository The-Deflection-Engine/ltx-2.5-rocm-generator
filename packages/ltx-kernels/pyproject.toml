[build-system]
requires = [
  "setuptools>=61",
  "wheel",
  "torch",
]
build-backend = "setuptools.build_meta"

[project]
name = "ltx-kernels"
version = "1.2.0"
dependencies = [
    "torch",
    "nvidia-cutlass-dsl>=4.6.0.dev0,<5; sys_platform == 'linux'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
